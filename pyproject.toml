[build-system]
requires = ["setuptools>=67.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkseg"
version = "1.3.0"
description = "SparkSeg: sparse prior-guided anchor attention for budgeted 3D CT and MRI segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Shuaishuai Chai" },
    { name = "Liang Jin" },
    { name = "Ming Li" },
]
dependencies = [
    "nnunetv2==2.8.0",
    "torch>=2.1.2,!=2.9.*",
    "numpy>=1.24",
    "SimpleITK>=2.2.1",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sparkseg-reproduce = "SparkSeg.reproduce:main"

[project.urls]
Homepage = "https://github.com/sshuaichai/SparkSeg"
Repository = "https://github.com/sshuaichai/SparkSeg"

[tool.setuptools]
packages = ["SparkSeg", "SparkSeg.network"]
package-dir = { SparkSeg = "." }

[tool.setuptools.package-data]
SparkSeg = [
    "assets/paper/*.png",
    "splits/*.json",
]
